name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The completion tests parse and source zsh, which the runner image lacks.
      - run: sudo apt-get install -y zsh

      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3

      # `just test` ends with `claude plugin test`, which runs the /rig mod's
      # tests and needs no login, only Claude Code on PATH.
      - run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: just test
