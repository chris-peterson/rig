name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The completion tests parse and source zsh, which the runner image lacks.
      - run: sudo apt-get install -y zsh

      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3

      - run: just test
