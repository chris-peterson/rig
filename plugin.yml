# Canonical descriptor for the rig plugin: edit here, never plugin.json.
# Projects into .claude-plugin/plugin.json (via shipyard gen-plugin-json) and
# the marketplace SPA (the suite: block).

name: rig
version: 1.0.0
description: "Switch Claude Code, or Grok Build, between named groups of plugins, and pin your local plugin checkouts in while you develop them."
author: chris-peterson
repository: https://github.com/chris-peterson/rig
icon: .claude-plugin/icon.svg
keywords: [plugins, launcher, context, local-development, plugin-development, claude-code, grok]
license: MIT

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It is the @AGENTS.md pointer.

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/rig/#/

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  cli: true
  group: passage
  gloss: "rig: pick the plugins for the job."
  pitch: "Different work, different plugins? Name the set once and launch with it."
  what: "A rig is a named group of plugins chosen for a kind of work. Every session loads only the rigs it needs: the ones you name, or the ones whose folder rules match where you launch, so plugins for other work stay out of its context. /rig switches a running session to other rigs and keeps the conversation. Pin a local plugin checkout and it stands in for the installed copy, so your edits take effect without a release."
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    hooks:
      cli-freshness: SessionStart — Tells you to run /rig:install-rig when the rig command on PATH runs an outdated install.
      hooks: 'Hook wiring: SessionStart→cli-freshness; modules→switch.'
      switch: module — /rig opens the --select picker inside the session, then relaunches the conversation with what you pick.
    commands:
      install-rig: Put the rig command on PATH with tab completion and make claude (and grok, when it's on PATH) run rig, or refresh them after a plugin update
  # <<< shipyard:describe <<<

docs:
  code_languages: [bash, yaml, markdown]
  mermaid: true
